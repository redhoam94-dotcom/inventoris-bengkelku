<title>Bengkel Self-Service</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header (brand, clock, tab row) over a single content column that splits into two columns on wide screens.
   Status colours follow the workshop rule: green = tersedia, amber = dipinjam, red = telat / rusak. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F3F5F9; --line:#D8DEE8; --ink:#12203A; --muted:#566782;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E4EBFD;
  --ok:#17794A; --ok-bg:#DFF3E7; --warn:#885705; --warn-bg:#FAEBC6; --bad:#B3261E; --bad-bg:#FADFDB;
  --f-display:'Space Grotesk',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1422; --surface:#141D30; --surface2:#1A2640; --line:#2A3858; --ink:#E7ECF6; --muted:#97A5BE;
    --accent:#7FA2FF; --accent-ink:#0D1422; --accent-soft:#1C2B52;
    --ok:#5FD39A; --ok-bg:#123524; --warn:#F0C25A; --warn-bg:#3A2D0E; --bad:#FF8A80; --bad-bg:#43191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#141D30; --surface2:#1A2640; --line:#2A3858; --ink:#E7ECF6; --muted:#97A5BE;
  --accent:#7FA2FF; --accent-ink:#0D1422; --accent-soft:#1C2B52;
  --ok:#5FD39A; --ok-bg:#123524; --warn:#F0C25A; --warn-bg:#3A2D0E; --bad:#FF8A80; --bad-bg:#43191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.15;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.code{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;display:block}
.clock{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);flex:none}
.clock b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);line-height:1.1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--bad);color:var(--bg);font-variant-numeric:tabular-nums}
.badge.soft{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

.view{padding-top:24px;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead p{color:var(--muted);margin-top:6px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card>.eyebrow+h2{margin-top:2px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2.wide-left{grid-template-columns:1.25fr 1fr}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.grid2,.grid2.wide-left{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}

.tile{border-radius:12px;padding:14px 16px;min-width:0}
.tile .n{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-weight:600;margin-top:8px;font-size:14px}
.tile .h{font-size:12px;opacity:.85}
.tone-ok{background:var(--ok-bg);color:var(--ok)}
.tone-warn{background:var(--warn-bg);color:var(--warn)}
.tone-bad{background:var(--bad-bg);color:var(--bad)}
.tone-ink{background:var(--surface2);color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}

.btn{font:inherit;font-weight:600;font-size:14px;min-height:42px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font:inherit;font-size:13px;font-weight:500;min-height:36px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}

label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=tel],input[type=search],select{font:inherit;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.row>div{min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.empty-sm{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:14px}
.empty-big{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-big p{color:var(--muted);max-width:46ch}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bt{border-radius:10px;padding:10px;min-width:0}
.bt .code{display:block;font-weight:500;color:var(--ink)}
.bt .nm{display:block;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.bt .st{font-size:11px;font-weight:700;letter-spacing:.02em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.bar-r .tr{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar-r .tr i{display:block;height:100%;border-radius:99px;background:var(--bad)}
.bar-r .tr i.acc{background:var(--accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{display:flex;flex-direction:column;gap:10px}
.tc .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tc .nm{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.25}
.tc .meta{font-size:13px;color:var(--muted)}
.tc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.qrbox{background:#fff;padding:12px;border-radius:10px;border:1px solid var(--line);width:150px}
.qrbox svg{display:block;width:100%;height:auto}
.qrwrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qrwrap p{font-size:12px;color:var(--muted);flex:1;min-width:140px}

.steps{display:flex;flex-direction:column;gap:22px}
.step{display:flex;flex-direction:column;gap:10px}
.step-h{display:flex;align-items:center;gap:10px;font-weight:600}
.step-h b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
.note{border-radius:10px;padding:12px 14px;font-size:14px}
.rule{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rule:first-of-type{border-top:0}
.rule b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}.zero{color:var(--muted)}

.wa{background:var(--surface2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:88%;padding:8px 12px;border-radius:12px;font-size:14px;overflow-wrap:anywhere}
.bubble small{display:block;font-size:11px;color:var(--muted);margin-top:2px;text-align:right}
.bubble.me{align-self:flex-end;background:var(--accent-soft)}
.bubble.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bubble.ghost{border-style:dashed}

.meter{position:relative;height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter.low i{background:var(--bad)}
.meter::after{content:"";position:absolute;left:70%;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45}
.score{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
details.ev summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);padding:4px 0}
details.ev ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
details.ev li{display:flex;gap:8px;justify-content:space-between}
details.ev li span:first-child{min-width:0;overflow-wrap:anywhere}
details.add{border:1px dashed var(--line);border-radius:14px;padding:4px 16px}
details.add summary{cursor:pointer;font-weight:600;padding:12px 0}
details.add form{padding-bottom:16px}

.tw{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13.5px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:180px}

input[type=file]{font:inherit;width:100%;padding:8px;border:1px dashed var(--line);border-radius:10px;background:var(--surface2);color:var(--ink)}
input[type=file]::file-selector-button{font:inherit;font-weight:600;margin-right:12px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.banner{border-radius:12px;padding:12px 16px;font-size:14px}
.skel{height:92px;border-radius:12px;background:var(--surface);border:1px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.skel{animation:none}*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="5" cy="11" r="3.4" fill="#4CC38A"/><circle cx="11" cy="11" r="3.4" fill="#F0B73A"/><circle cx="17" cy="11" r="3.4" fill="#F2685C"/></svg>
        </span>
        <div><b>Bengkel TI</b><small>Peminjaman alat self-service</small></div>
      </div>
      <div class="clock" id="clock" aria-hidden="true"></div>
    </div>
    <nav class="tabs" id="nav" aria-label="Menu utama"></nav>
  </header>
  <main class="view" id="view"></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var MIN=60000,HR=3600000,THRESH=70,MAXS=100;
var TABS=[['dasbor','Dasbor'],['alat','Alat'],['pinjam','Pinjam'],['kembali','Kembali'],['siswa','Siswa & skor'],['data','Data']];
var S={tools:[],students:[],loans:[],adj:[],v:0};
var ui={loaded:{},canWrite:true,db:null,dl:null,tab:'dasbor',pickTool:'',pickStudent:'',dur:'2',filter:'all',q:'',cond:{},qrOpen:{},dataTab:'alat',dq:'',lastMsg:null,timeout:false,busy:false,pending:false,nodb:false,err:''};

/* ---------- format ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var fT=function(ms){var d=new Date(ms);return pad(d.getHours())+'.'+pad(d.getMinutes())};
var fD=function(ms){var d=new Date(ms);return d.getDate()+' '+MON[d.getMonth()]};
var fDT=function(ms){return fD(ms)+', '+fT(ms)};
var fDur=function(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),r=m%60;return h?(h+' j'+(r?' '+r+' m':'')):(r+' m')};
var first=function(n){return String(n||'').split(' ')[0]};
var toolNo=function(c){var n=parseInt(String(c).split('-').pop(),10);return isNaN(n)?c:n};
var byCode=function(a,b){return a.code.localeCompare(b.code,'id',{numeric:true})};
var sign=function(d){return d>0?'+'+d:d<0?'−'+Math.abs(d):'0'};
var COND={baik:'Baik',rusak:'Rusak',hilang:'Hilang'};

/* ---------- derived data ---------- */
function activeLoanOf(id){return S.loans.find(function(l){return l.toolId===id&&!l.returnedAt})}
function toolState(t,now){
  if(t.condition==='rusak')return{k:'rusak',label:'Rusak'};
  if(t.condition==='hilang')return{k:'hilang',label:'Hilang'};
  var l=activeLoanOf(t.id);
  if(l)return now>l.dueAt?{k:'telat',label:'Telat',loan:l}:{k:'dipinjam',label:'Dipinjam',loan:l};
  return{k:'tersedia',label:'Tersedia'};
}
var tone=function(k){return k==='tersedia'?'ok':k==='dipinjam'?'warn':'bad'};
function deltaFor(l,cond,at){
  if(cond==='rusak')return{d:-50,why:'Alat rusak, wajib diperbaiki atau diganti'};
  if(cond==='hilang')return{d:-50,why:'Alat hilang, wajib diganti'};
  var late=(at-l.dueAt)/MIN;
  if(late<=0)return{d:5,why:'Kembali tepat waktu'};
  if(late>=60)return{d:-10,why:'Telat '+fDur(late)};
  return{d:0,why:'Telat '+fDur(late)+', belum sampai 1 jam'};
}
var cache={k:'',m:null};
function scores(){
  var key=S.v+':'+Math.floor(Date.now()/MIN);
  if(cache.k===key)return cache.m;
  var m={},evs=[],now=Date.now();
  S.students.forEach(function(s){m[s.nis]={score:MAXS,events:[],loans:0,late:0,bad:0}});
  S.loans.forEach(function(l){
    var e=m[l.nis];if(!e)return;e.loans++;
    if(l.returnedAt){
      var r=deltaFor(l,l.condition,l.returnedAt);
      evs.push({nis:l.nis,at:l.returnedAt,d:r.d,why:r.why+': '+l.toolName+' '+l.toolCode});
      if(l.condition==='rusak'||l.condition==='hilang')e.bad++;
      if(l.returnedAt>l.dueAt)e.late++;
    }else if(now>l.dueAt)e.late++;
  });
  S.adj.forEach(function(a){if(m[a.nis])evs.push({nis:a.nis,at:a.at,d:a.points,why:a.reason||'Penyesuaian skor'})});
  evs.sort(function(a,b){return a.at-b.at}).forEach(function(ev){
    var e=m[ev.nis];e.score=Math.max(0,Math.min(MAXS,e.score+ev.d));ev.after=e.score;e.events.push(ev);
  });
  cache={k:key,m:m};return m;
}
function eligibility(stu,tool,now){
  if(!stu||!tool)return{ok:false,msg:'',hint:true};
  var st=toolState(tool,now);
  if(st.k!=='tersedia')return{ok:false,msg:tool.name+' '+tool.code+' sedang tidak tersedia ('+st.label.toLowerCase()+').'};
  var od=S.loans.find(function(l){return l.nis===stu.nis&&!l.returnedAt&&now>l.dueAt});
  if(od)return{ok:false,msg:first(stu.name)+' masih punya pinjaman yang telat ('+od.toolName+' '+od.toolCode+'). Kembalikan dulu.'};
  var sc=scores()[stu.nis].score;
  if(tool.premium&&sc<THRESH)return{ok:false,msg:'Skor '+first(stu.name)+' '+sc+', di bawah '+THRESH+'. Alat mahal belum bisa dipinjam. Bantu beres-beres bengkel untuk menaikkan skor.'};
  return{ok:true,msg:'Skor '+sc+'. '+first(stu.name)+' boleh meminjam '+tool.name+' '+tool.code+'.'};
}
function durOpts(now){
  var o=[{k:'1',label:'1 jam',at:now+HR},{k:'2',label:'2 jam',at:now+2*HR},{k:'3',label:'3 jam',at:now+3*HR}];
  var d=new Date(now);d.setHours(15,0,0,0);
  if(d.getTime()-now>=30*MIN)o.push({k:'sd',label:'Sampai 15.00',at:d.getTime()});
  return o;
}
function dueFor(now){var o=durOpts(now);return(o.find(function(x){return x.k===ui.dur})||o[1]).at}

/* ---------- small pieces ---------- */
function pill(k,label){return '<span class="pill tone-'+tone(k)+'">'+esc(label)+'</span>'}
function head(t,s,right){return '<div class="phead"><div><h1>'+t+'</h1><p>'+s+'</p></div>'+(right||'')+'</div>'}
function qrSvg(text){
  try{
    if(typeof qrcode!=='function')return '';
    var q=qrcode(0,'M');q.addData(text);q.make();
    return q.createSvgTag({cellSize:4,margin:0,scalable:true});
  }catch(e){return ''}
}
function emptyState(){

  }).join('')+'</div>':'<div class="empty-sm">Tidak ada alat yang sedang keluar.</div>';
  h+='</section></div>';

function toolCard(t,st,now){

  else a='<button class="btn sm" data-act="goto" data-to="kembali">Terima kembali</button>';
  var open=!!ui.qrOpen[t.id],qr=open?qrSvg('PINJAM '+t.code):'';
  return '<article class="card tc"><div class="top2"><div><span class="code muted">'+esc(t.code)+'</span><div class="nm">'+esc(t.name)+'</div></div>'+pill(st.k==='hilang'?'hilang':st.k,st.label)+'</div>'
    +'<div class="meta">'+esc(t.category||'Umum')+(t.premium?' · alat mahal, butuh skor ≥ '+THRESH:' · bebas untuk semua skor')+'</div>'
    +(l?'<div class="meta">'+esc(l.studentName)+' · kembali '+fT(l.dueAt)+(now>l.dueAt?' ('+fDur((now-l.dueAt)/MIN)+' lewat)':'')+'</div>':'')
    +(open?'<div class="qrwrap"><div class="qrbox">'+(qr||'<span class="code" style="color:#000">PINJAM '+esc(t.code)+'</span>')+'</div><p>Isi QR contoh: <span class="code">PINJAM '+esc(t.code)+'</span>. Untuk bot sungguhan, ganti dengan tautan wa.me ke nomor bot bengkel.</p></div>':'')

function alatList(now){
  var q=ui.q.trim().toLowerCase();

    var g=x.st.k==='hilang'?'rusak':x.st.k;
    if(ui.filter!=='all'&&g!==ui.filter)return false;
    return !q||(x.t.code+' '+x.t.name+' '+(x.t.category||'')).toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){return byCode(a.t,b.t)});
  if(!items.length)return '<div class="empty-sm">Tidak ada alat yang cocok dengan pencarian atau filter ini.</div>';

/* ---------- impor CSV ---------- */
function normKey(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  var firstLine=text.split(/\r?\n/)[0]||'';
  var delim=firstLine.split(';').length>firstLine.split(',').length?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=c;
    }else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!==''})});
}
function buildImport(table,rows){
  if(rows.length-1>300)return{error:'Maksimal 300 baris per impor. File ini berisi '+(rows.length-1)+' baris.'};
  var hdr=rows[0].map(normKey);
  var idx=function(names){for(var i=0;i<names.length;i++){var j=hdr.indexOf(names[i]);if(j>-1)return j}return -1};
  var cell=function(r,i){return i<0?null:String(r[i]==null?'':r[i]).trim().replace(/^'(?=[=+\-@])/,'')};
  var items=[],seen={};
  if(table==='alat'){
    var iC=idx(['kode']),iN=idx(['nama','namaalat']),iK=idx(['kategori']),iM=idx(['alatmahal','mahal','premium']),iD=idx(['kondisi']);
    if(iC<0||iN<0)return{error:'Baris pertama harus berisi kolom Kode dan Nama. Unduh templat untuk contoh formatnya.'};
    rows.slice(1).forEach(function(r,n){
      var code=(cell(r,iC)||'').toUpperCase().slice(0,12),name=(cell(r,iN)||'').slice(0,40),id=code.toLowerCase().replace(/[^a-z0-9-]/g,'');
      var it={line:n+2,key:id,id:code||'-',name:name,kind:'skip',msg:''};
      var ex=S.tools.find(function(t){return t.id===id});
      var cond=iD>-1?(cell(r,iD)||'').toLowerCase():'';
      var mv=iM>-1?(cell(r,iM)||'').toLowerCase():'';
      if(!id||!name)it.msg='Kode atau nama kosong';
      else if(seen[id])it.msg='Kode ganda di dalam file';
      else if(cond&&!COND[cond])it.msg='Kondisi harus Baik, Rusak, atau Hilang';
      else if(mv&&!/^(ya|y|yes|true|1|tidak|t|no|false|0)$/.test(mv))it.msg='Alat mahal harus Ya atau Tidak';
      else{
        seen[id]=1;
        var prem=mv?/^(ya|y|yes|true|1)$/.test(mv):(ex?!!ex.premium:false);
        it.data={code:code,name:name,category:(iK>-1&&cell(r,iK))?cell(r,iK).slice(0,30):(ex?ex.category||'':''),premium:prem,condition:cond||(ex&&ex.condition)||'baik'};
        it.kind=ex?'update':'new';
      }
      items.push(it);
    });
  }else{
    var iS=idx(['nis']),iN2=idx(['nama','namalengkap']),iL=idx(['kelas']),iW=idx(['whatsapp','wa','nomorwa','nomorwhatsapp','hp']);
    if(iS<0||iN2<0)return{error:'Baris pertama harus berisi kolom NIS dan Nama. Unduh templat untuk contoh formatnya.'};
    rows.slice(1).forEach(function(r,n){
      var nis=(cell(r,iS)||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,20),name=(cell(r,iN2)||'').slice(0,60);
      var it={line:n+2,key:nis,id:nis||'-',name:name,kind:'skip',msg:''};
      var ex=S.students.find(function(s){return s.nis===nis});
      if(!nis||!name)it.msg='NIS atau nama kosong';
      else if(seen[nis])it.msg='NIS ganda di dalam file';
      else{
        seen[nis]=1;
        it.data={nis:nis,name:name,kelas:(iL>-1&&cell(r,iL))?cell(r,iL).slice(0,20):(ex?ex.kelas||'':''),wa:(iW>-1&&cell(r,iW))?cell(r,iW).slice(0,20):(ex?ex.wa||'':'')};
        it.kind=ex?'update':'new';
      }
      items.push(it);
    });
  }
  return{items:items};
}

async function onFile(f){
  if(!f)return;
  if(f.size>1048576){ui.imp={error:'File terlalu besar. Batas 1 MB.'};refreshImp();return}
  try{
    var rows=parseCSV(await f.text());
    if(rows.length<2)ui.imp={error:'File kosong atau hanya berisi baris header.'};
    else ui.imp=Object.assign({table:ui.dataTab,name:f.name},buildImport(ui.dataTab,rows));
  }catch(e){ui.imp={error:'File tidak bisa dibaca. Pastikan formatnya CSV.'}}
  refreshImp();
}

});
function readHash(){
  var h=location.hash.replace('#','');
  var t=TABS.some(function(x){return x[0]===h})?h:'dasbor';
  if(ui.tab==='pinjam'&&t!=='pinjam')ui.lastMsg=null;
  ui.tab=t;
}
window.addEventListener('hashchange',function(){readHash();renderAll();window.scrollTo(0,0)});

/* ---------- boot ---------- */
function sub(name,key){
  return ui.db.collection(name).onSnapshot(function(snap){
    S[key]=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
    ui.loaded[name]=true;S.v++;schedule();
  },function(err){ui.loaded[name]=true;ui.err=(err&&err.code)||'error';schedule()});
}
async function init(){
  readHash();renderAll();
  setTimeout(function(){if(!ready()){ui.timeout=true;renderView()}},10000);
  setInterval(function(){renderClock();if(ready()&&ui.tab!=='pinjam')schedule()},30000);
  var c=window.claude;
  if(!c||typeof c.use!=='function'){ui.nodb=true;renderView();return}
  var db=null,user=null;
  try{db=await c.use('db')}catch(e){}
  try{user=await c.use('user')}catch(e){}
  try{ui.dl=await c.use('downloads')}catch(e){}
  if(!db){ui.nodb=true;renderAll();return}
  ui.db=db;
  try{if(user&&typeof user.can==='function'){var cw=await user.can('data.write');ui.canWrite=cw!==false}}catch(e){}
  sub('tools','tools');sub('students','students');sub('loans','loans');sub('adjustments','adj');
}
init();
})();
</script>
